<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caja de Pandora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Style.css">
<style>
  :root{
    --cream: #f7f0de;
    --ink: #000000;
    --mustard: #f8cc05;
    --terracotta: #da6a2a;
    --paper: #fffaf0;
    --mute: #7a7268;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0;
    min-height:100vh;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    overflow-x:hidden;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding: 7vh 20px 8vh;
    min-height:100vh;
  }

  /* "Sin apuro" sticker badge, inspired by the boceto sheet */
  .badge{
    position:relative;
    display:inline-block;
    margin-bottom: 44px;
    padding: 10px 4px;
  }
  .badge .chip{
    position:absolute;
    border-radius: 3px;
  }
  .badge .chip.back{
    background: var(--terracotta);
    top:-6px; left:14px; right:-4px;
    height: 52%;
    transform: rotate(-3deg);
  }
  .badge .chip.front{
    background: var(--mustard);
    bottom:-10px; left:-6px; right:12px;
    height: 62%;
    transform: rotate(2deg);
  }
  .badge .chip.tail{
    background: var(--mustard);
    width: 16px; height:16px;
    right: 6px; bottom: -20px;
    clip-path: polygon(0 0, 100% 0, 0 100%);
    transform: rotate(2deg);
  }
  .badge .word{
    position:relative;
    font-family:'Archivo Black', 'Helvetica Neue', sans-serif;
    font-size: 30px;
    line-height: 0.95;
    color: var(--ink);
    letter-spacing: -0.01em;
  }
  .badge .word .sin{
    display:block;
    font-style: italic;
    transform: skewX(-6deg);
    margin-left: 2px;
  }
  .badge .word .apuro{
    display:block;
  }

  h1{
    font-family:'Archivo Black', 'Helvetica Neue', sans-serif;
    font-weight: 400;
    font-size: clamp(2.1rem, 6.4vw, 3.6rem);
    letter-spacing: -0.01em;
    margin: 0 0 48px;
    text-align:center;
    line-height: 1.05;
  }
  h1 .hi{
    position:relative;
    white-space:nowrap;
  }
  h1 .hi::before{
    content:'';
    position:absolute;
    left:-6px; right:-6px;
    bottom: 6px;
    height: 34%;
    background: var(--mustard);
    z-index:-1;
    transform: rotate(-1deg);
  }

  .stage{
    position:relative;
    width: min(340px, 80vw);
    height: 320px;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    perspective: 1400px;
  }

  /* light burst */
  .burst{
    position:absolute;
    left:50%; bottom: 70px;
    width: 40px; height: 40px;
    transform: translate(-50%, 0) scale(0.3);
    border-radius:50%;
    background: radial-gradient(circle, var(--mustard) 0%, rgba(240,194,57,0.5) 35%, transparent 70%);
    opacity:0;
    filter: blur(2px);
    transition: transform 1.1s cubic-bezier(.2,.9,.25,1), opacity 1.1s ease;
    pointer-events:none;
  }
  .stage.open .burst{
    transform: translate(-50%, -40px) scale(9);
    opacity: 1;
  }

  /* particles */
  .particles{
    position:absolute;
    left:50%; bottom:110px;
    width:2px; height:2px;
    pointer-events:none;
  }
  .particle{
    position:absolute;
    width:5px; height:5px;
    border-radius:1px;
    background: var(--terracotta);
    opacity:0;
  }
  .particle:nth-child(odd){ background: var(--mustard); border-radius:50%; }
  .stage.open .particle{
    animation: rise 1.6s ease-out forwards;
  }
  @keyframes rise{
    0%{ opacity:0; transform: translate(0,0) rotate(0deg) scale(1); }
    15%{ opacity:1; }
    100%{ opacity:0; transform: translate(var(--dx), -220px) rotate(180deg) scale(0.5); }
  }

  /* box */
  .box{
    position:relative;
    width: 220px;
    height: 150px;
    transform-style: preserve-3d;
  }

  .box-body{
    position:absolute;
    bottom:0; left:0; right:0;
    height: 108px;
    background: var(--ink);
    border-radius: 4px 4px 8px 8px;
    box-shadow: 0 20px 40px rgba(22,19,17,0.25);
  }
  .box-body::before{
    /* terracotta band */
    content:'';
    position:absolute;
    left:0; right:0; top:38%;
    height: 9px;
    background: var(--terracotta);
  }
  .box-body::after{
    /* keyhole plate */
    content:'';
    position:absolute;
    left:50%; top:50%;
    width: 20px; height: 24px;
    transform: translate(-50%,-30%);
    background: var(--mustard);
    clip-path: polygon(38% 0%, 62% 0%, 62% 40%, 100% 100%, 0% 100%, 38% 40%);
  }

  .box-lid{
    position:absolute;
    top:0; left:-4px; right:-4px;
    height: 62px;
    background: var(--ink);
    border-radius: 8px 8px 3px 3px;
    transform-origin: bottom center;
    transition: transform 1.05s cubic-bezier(.34,1.4,.4,1), box-shadow 1s ease;
    z-index:2;
  }
  .box-lid::before{
    content:'';
    position:absolute;
    left:0; right:0; bottom:0;
    height:7px;
    background: var(--mustard);
  }
  .stage.open .box-lid{
    transform: rotateX(-125deg) translateY(2px);
    box-shadow: 0 0 40px rgba(240,194,57,0.5);
  }

  .studs{
    position:absolute; inset:0;
    pointer-events:none;
  }
  .stud{
    position:absolute;
    width:6px; height:6px;
    border-radius:50%;
    background: var(--mustard);
  }

  /* result card */
  .card{
    position:absolute;
    left:50%;
    bottom: 150px;
    width: min(300px, 84vw);
    transform: translate(-50%, 20px) scale(0.85);
    opacity:0;
    background: var(--paper);
    color: var(--ink);
    border-radius: 6px;
    padding: 22px 22px 20px;
    text-align:center;
    box-shadow: 0 30px 60px rgba(22,19,17,0.3);
    transition: transform 0.6s cubic-bezier(.2,1.4,.3,1), opacity 0.5s ease;
    z-index:3;
  }
  .card::before{
    content:'';
    position:absolute;
    left: 10px; right:10px; top:-6px;
    height: 10px;
    background: var(--terracotta);
    border-radius: 3px 3px 0 0;
    z-index:-1;
  }
  .card.show{
    transform: translate(-50%, 0) scale(1);
    opacity:1;
  }
  .card .tag{
    font-family:'Archivo Black', 'Helvetica Neue', sans-serif;
    font-size: 11px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color: var(--terracotta);
    margin-bottom: 10px;
    display:block;
  }
  .card .prompt{
    font-family:'Archivo Black', 'Helvetica Neue', sans-serif;
    font-size: 19px;
    line-height:1.35;
  }

  .action{
    margin-top: 54px;
    background: var(--ink);
    border: none;
    color: var(--mustard);
    font-family:'Archivo Black', 'Helvetica Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 16px 34px;
    border-radius: 3px;
    cursor:pointer;
    transition: background 0.25s ease, color 0.25s ease, transform 0.15s ease;
  }
  .action:hover{
    background: var(--terracotta);
    color: var(--paper);
  }
  .action:active{ transform: translateY(1px); }
  .action:disabled{
    opacity:0.5;
    cursor:default;
  }

  @media (prefers-reduced-motion: reduce){
    .box-lid, .burst, .particle, .card{ transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

  <img src="Imagenes/logo_boceto1.png" alt="Sin apuro" class="logo-img">

  <h1>Caja de <span class="hi">Pandora</span></h1>

  <div class="stage" id="stage">
    <div class="burst"></div>
    <div class="particles" id="particles"></div>

    <div class="card" id="card">
     <!-- <span class="tag">Te tocó</span>-->
      <div class="prompt" id="prompt">—</div>
    </div>

    <div class="box">
      <div class="box-lid"></div>
      <div class="box-body">
        <div class="studs">
          <div class="stud" style="left:10px; top:14px;"></div>
          <div class="stud" style="right:10px; top:14px;"></div>
          <div class="stud" style="left:10px; bottom:12px;"></div>
          <div class="stud" style="right:10px; bottom:12px;"></div>
        </div>
      </div>
    </div>
  </div>

  <button class="action" id="btn">Abrir la caja</button>

<script>
  const consignas = [
    "Una canción que defina tu juventud",
    "Un artista de la escena actual",
    "Una película argentina que te guste mucho",
    "Un director/a de cine"
  ];

  let remaining = [...consignas];
  const stage = document.getElementById('stage');
  const card = document.getElementById('card');
  const promptEl = document.getElementById('prompt');
  const btn = document.getElementById('btn');
  const particlesWrap = document.getElementById('particles');

  function spawnParticles(){
    particlesWrap.innerHTML = '';
    const n = 14;
    for(let i=0;i<n;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      const dx = (Math.random()-0.5) * 160;
      p.style.setProperty('--dx', dx + 'px');
      p.style.left = (Math.random()*40 - 20) + 'px';
      p.style.animationDelay = (Math.random()*0.3) + 's';
      particlesWrap.appendChild(p);
    }
  }

  function shuffleReveal(finalText){
    let ticks = 0;
    const maxTicks = 14;
    const interval = setInterval(() => {
      const randomPick = consignas[Math.floor(Math.random()*consignas.length)];
      promptEl.textContent = randomPick;
      ticks++;
      if(ticks >= maxTicks){
        clearInterval(interval);
        promptEl.textContent = finalText;
      }
    }, 65);
  }

  function openBox(){
    // si ya salieron todas, vuelven a estar disponibles
    if(remaining.length === 0){
      remaining = [...consignas];
    }

    btn.disabled = true;
    card.classList.remove('show');
    stage.classList.remove('open');

    // force reflow so the closing/reset transition can replay
    void stage.offsetWidth;

    const idx = Math.floor(Math.random() * remaining.length);
    const chosen = remaining.splice(idx, 1)[0];

    stage.classList.add('open');
    spawnParticles();

    setTimeout(() => {
      card.classList.add('show');
      shuffleReveal(chosen);
    }, 420);

    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = 'Cerrar y abrir otra vez';
    }, 1500);
  }

  btn.addEventListener('click', openBox);
</script>

</body>
</html>
